name: Format C++ Sources

on:
  push:
    branches: [ "main" ]
    paths:
      - "app/src/main/cpp/**/*.cpp"
      - "app/src/main/cpp/**/*.h"
      - "app/src/main/cpp/**/*.hpp"
      - "app/src/main/cpp/**/*.inc"
      - ".clang-format"
      - ".github/workflows/format-cpp.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: format-cpp-main
  cancel-in-progress: true

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install clang-format
        run: |
          sudo apt-get update
          sudo apt-get install -y clang-format

      - name: Format C++ and class-include files
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import subprocess

          root = Path("app/src/main/cpp")

          # Format regular C++ translation units and headers directly.
          for path in root.rglob("*"):
              if path.suffix in {".cpp", ".h", ".hpp"} and path.name != "stb_image.h":
                  subprocess.run(["clang-format", "-i", str(path)], check=True)

          # The .inc files are included inside Game, so format them as class members.
          for path in root.rglob("*.inc"):
              source = path.read_text(encoding="utf-8")
              wrapped = "class __FormatWrapper {\n" + source + "\n};\n"
              result = subprocess.run(
                  ["clang-format"],
                  input=wrapped,
                  text=True,
                  capture_output=True,
                  check=True,
              )
              lines = result.stdout.splitlines()
              if not lines or lines[0].strip() != "class __FormatWrapper {" or lines[-1].strip() != "};":
                  raise RuntimeError(f"Unexpected clang-format wrapper output for {path}")
              path.write_text("\n".join(lines[1:-1]) + "\n", encoding="utf-8")
          PY

      - name: Commit formatted sources
        run: |
          if git diff --quiet; then
            echo "All C++ sources already follow the formatting rules."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/cpp
          git commit -m "style: format C++ source files"
          git push origin HEAD:main
