plugins {
    id 'com.android.application'
}

android {
    namespace 'com.khalilxmodz.deathcraft'
    compileSdk 35

    defaultConfig {
        applicationId 'com.khalilxmodz.deathcraft'
        minSdk 23
        targetSdk 28
        ndkVersion '27.2.12479018'
        versionCode 1
        versionName '0.1.0'

        ndk {
            abiFilters 'armeabi-v7a', 'arm64-v8a'
        }

        externalNativeBuild {
            cmake {
                cppFlags '-std=c++20 -O2'
                arguments '-DANDROID_STL=c++_static'
            }
        }
    }

    externalNativeBuild {
        cmake {
            path file('src/main/cpp/CMakeLists.txt')
            version '3.22.1'
        }
    }

    buildTypes {
        debug {
            minifyEnabled false
        }
        release {
            minifyEnabled false
        }
    }
}
